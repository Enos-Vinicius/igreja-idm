<div class="overflow-hidden">
  <!-- Container com 100% largura e 80% altura -->
  <div class="hero-container relative overflow-hidden">
    <!-- Imagem de fundo -->
    <img src="assets/landing/travel-hero-bg.jpg" alt="Hero Background"
         class="absolute top-0 left-0 w-full h-full hero-bg-image">

    <!-- Película preta - gradiente de cima pra baixo -->
    <div class="absolute top-0 left-0 w-full h-full hero-gradient-dark opacity-60"></div>

    <!-- Película branca - gradiente de baixo pra cima (300px) -->
    <div class="absolute bottom-0 left-0 w-full hero-gradient-white"></div>

    <!-- Container PrimeFlex centralizado -->
    <div class="container absolute top-0 left-50 hero-container-wrapper">
      <!-- Div relative ocupando 100% de largura e altura -->
      <div class="relative w-full h-full">
        <!-- Cloud 2 - width 100%, max-width 520px, top left (atrás do texto) -->
        <img src="assets/landing/cloud-2.png" alt="Cloud 2"
             class="absolute w-full cloud-2 z-2">

        <!-- Cloud 3 - top -400px, right -300px (atrás do texto) -->
        <img src="assets/landing/cloud-3.png" alt="Cloud 3"
             class="absolute cloud-3 z-3">

        <!-- Texto principal - ALINHAMENTO (meio) -->
        <div class="absolute hero-text z-5 flex justify-content-center align-items-center w-full">
          <h1 class="hero-title">ALINHAMENTO</h1>
        </div>

        <!-- Cloud 1 - 100% width, bottom (na frente do texto) -->
        <img src="assets/landing/cloud-1.png" alt="Cloud 1"
             class="absolute w-full cloud-1 z-6">

        <!-- Cloud 4 - 100% width, bottom (na frente do texto) -->
        <img src="assets/landing/cloud-4.png" alt="Cloud 4"
             class="absolute w-full cloud-4 z-7">

        <!-- Cloud 5 (primeira) - left -782px (na frente do texto) -->

             class="absolute cloud-5 cloud-5-1 z-8 opacity-80">

        <!-- Cloud 5 (segunda) - left -400px (na frente do texto) -->
        <img src="assets/landing/cloud-5.png" alt="Cloud 5"
             class="absolute cloud-5 cloud-5-2 z-9 opacity-70">

        <!-- Cloud 5 (terceira) - left 160px (na frente do texto) -->
        <img src="assets/landing/cloud-5.png" alt="Cloud 5"
             class="absolute cloud-5 cloud-5-3 z-10 opacity-70">
      </div>
    </div>
  </div>
