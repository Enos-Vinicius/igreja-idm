<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="cloudGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:0.92" />
    </linearGradient>
    <filter id="cloudShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#cloudShadow3)">
    <ellipse cx="300" cy="160" rx="160" ry="90" fill="url(#cloudGrad3)"/>
    <ellipse cx="180" cy="175" rx="120" ry="75" fill="url(#cloudGrad3)"/>
    <ellipse cx="420" cy="170" rx="130" ry="80" fill="url(#cloudGrad3)"/>
    <ellipse cx="260" cy="130" rx="100" ry="65" fill="url(#cloudGrad3)"/>
    <ellipse cx="360" cy="140" rx="110" ry="70" fill="url(#cloudGrad3)"/>
    <ellipse cx="120" cy="190" rx="80" ry="55" fill="url(#cloudGrad3)"/>
    <ellipse cx="480" cy="185" rx="90" ry="60" fill="url(#cloudGrad3)"/>
  </g>
</svg>
