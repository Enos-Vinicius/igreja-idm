<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
  <defs>
    <linearGradient id="cloudGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f3f5;stop-opacity:0.9" />
    </linearGradient>
    <filter id="cloudShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#cloudShadow2)">
    <ellipse cx="350" cy="180" rx="180" ry="100" fill="url(#cloudGrad2)"/>
    <ellipse cx="220" cy="200" rx="140" ry="90" fill="url(#cloudGrad2)"/>
    <ellipse cx="480" cy="190" rx="150" ry="95" fill="url(#cloudGrad2)"/>
    <ellipse cx="300" cy="150" rx="120" ry="80" fill="url(#cloudGrad2)"/>
    <ellipse cx="420" cy="160" rx="130" ry="85" fill="url(#cloudGrad2)"/>
    <ellipse cx="150" cy="220" rx="100" ry="65" fill="url(#cloudGrad2)"/>
    <ellipse cx="550" cy="210" rx="110" ry="70" fill="url(#cloudGrad2)"/>
  </g>
</svg>
