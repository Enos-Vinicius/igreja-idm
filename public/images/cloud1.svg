<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:0.95" />
    </linearGradient>
    <filter id="cloudShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#cloudShadow1)">
    <!-- Nuvem principal fofa -->
    <ellipse cx="400" cy="220" rx="200" ry="120" fill="url(#cloudGrad1)"/>
    <ellipse cx="280" cy="240" rx="150" ry="100" fill="url(#cloudGrad1)"/>
    <ellipse cx="520" cy="230" rx="160" ry="110" fill="url(#cloudGrad1)"/>
    <ellipse cx="350" cy="180" rx="130" ry="90" fill="url(#cloudGrad1)"/>
    <ellipse cx="480" cy="190" rx="140" ry="95" fill="url(#cloudGrad1)"/>
    <ellipse cx="200" cy="260" rx="120" ry="80" fill="url(#cloudGrad1)"/>
    <ellipse cx="600" cy="250" rx="130" ry="85" fill="url(#cloudGrad1)"/>
    <ellipse cx="320" cy="270" rx="110" ry="70" fill="url(#cloudGrad1)"/>
    <ellipse cx="450" cy="260" rx="120" ry="75" fill="url(#cloudGrad1)"/>
  </g>
</svg>
