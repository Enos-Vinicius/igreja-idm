<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- Gradiente do céu - azul para dourado -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="20%" style="stop-color:#1e3a8a"/>
      <stop offset="40%" style="stop-color:#1e40af"/>
      <stop offset="60%" style="stop-color:#3b82f6"/>
      <stop offset="80%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>

    <!-- Raios de luz -->
    <linearGradient id="lightRay" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </linearGradient>

    <!-- Brilho central -->
    <radialGradient id="sunGlow" cx="50%" cy="85%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8"/>
      <stop offset="30%" style="stop-color:#f59e0b;stop-opacity:0.4"/>
      <stop offset="70%" style="stop-color:#f59e0b;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>

    <!-- Caminho de luz -->
    <linearGradient id="pathGlow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Céu -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>

  <!-- Brilho do sol/luz divina -->
  <ellipse cx="960" cy="920" rx="800" ry="400" fill="url(#sunGlow)"/>

  <!-- Raios de luz convergentes (Alinhamento) -->
  <g opacity="0.4">
    <polygon fill="url(#lightRay)" points="960,1080 860,0 1060,0"/>
    <polygon fill="url(#lightRay)" points="960,1080 660,0 760,0" opacity="0.7"/>
    <polygon fill="url(#lightRay)" points="960,1080 1160,0 1260,0" opacity="0.7"/>
    <polygon fill="url(#lightRay)" points="960,1080 460,0 560,0" opacity="0.5"/>
    <polygon fill="url(#lightRay)" points="960,1080 1360,0 1460,0" opacity="0.5"/>
    <polygon fill="url(#lightRay)" points="960,1080 260,0 360,0" opacity="0.3"/>
    <polygon fill="url(#lightRay)" points="960,1080 1560,0 1660,0" opacity="0.3"/>
  </g>

  <!-- Caminho de luz central (simbolizando alinhamento/direção) -->
  <polygon fill="url(#pathGlow)" points="960,1080 800,1080 880,600 960,400 1040,600 1120,1080" opacity="0.3"/>

  <!-- Estrelas/pontos de luz -->
  <g fill="#ffffff">
    <circle cx="200" cy="100" r="1.5" opacity="0.8"/>
    <circle cx="400" cy="180" r="1" opacity="0.6"/>
    <circle cx="150" cy="250" r="1.2" opacity="0.7"/>
    <circle cx="600" cy="120" r="1" opacity="0.5"/>
    <circle cx="350" cy="80" r="1.3" opacity="0.8"/>
    <circle cx="1520" cy="100" r="1.5" opacity="0.8"/>
    <circle cx="1720" cy="180" r="1" opacity="0.6"/>
    <circle cx="1570" cy="250" r="1.2" opacity="0.7"/>
    <circle cx="1320" cy="120" r="1" opacity="0.5"/>
    <circle cx="1670" cy="80" r="1.3" opacity="0.8"/>
    <circle cx="800" cy="60" r="1" opacity="0.6"/>
    <circle cx="1100" cy="90" r="1.2" opacity="0.7"/>
    <circle cx="960" cy="150" r="1.5" opacity="0.5"/>
  </g>

  <!-- Nuvens sutis -->
  <g opacity="0.15">
    <ellipse cx="300" cy="400" rx="200" ry="60" fill="#ffffff"/>
    <ellipse cx="250" cy="420" rx="150" ry="50" fill="#ffffff"/>
    <ellipse cx="1600" cy="350" rx="180" ry="55" fill="#ffffff"/>
    <ellipse cx="1650" cy="370" rx="140" ry="45" fill="#ffffff"/>
  </g>
</svg>
